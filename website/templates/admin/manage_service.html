{% extends "admin/base.html" %}
{% block title %}Manage Services{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{url_for('static',filename='admin/css/manage_service.css')}}">

<div class="ttl-btn">
  <h2>Manage Services</h2>
  <button id="addServiceBtn"> Add Service</button>
</div>

<table class="customer-table" id="serviceTable">
  <tr>
    <th>ID</th>
    <th>Service</th>
    <th>Image</th>
    <th>Actions</th>
  </tr>
  {% for s in services %}
  <tr id="row-{{ s.id }}">
    <td>{{ s.id }}</td>
    <td>{{ s.name }}</td>
    <td>
      {% if s.image %}
        <img src="{{ url_for('static', filename='admin/image/' ~ s.image) }}" width="100">
      {% endif %}
    </td>
    <td>
      <button class="editServiceBtn" data-id="{{ s.id }}"> Edit</button>
      <button class="deleteServiceBtn" data-id="{{ s.id }}"> Delete</button>
    </td>
  </tr>
  {% endfor %}
</table>

<!-- Add Service Popup -->
<div id="addServicePopup" class="popup">
  <div class="popup-content">
    <span id="addServiceCloseBtn" class="popup-close">&times;</span>
    <h2>Add Service</h2>
    <form id="addServiceForm" enctype="multipart/form-data">
      <input type="text" name="name" placeholder="Service Name" required>
      <input type="file" name="image">
      <button type="submit">Save</button>
    </form>
  </div>
</div>

<!-- Edit Service Popup -->
<div id="editServicePopup" class="popup">
  <div class="popup-content">
    <span id="editServiceCloseBtn" class="popup-close">&times;</span>
    <h2>Edit Service</h2>
    <form id="editServiceForm" enctype="multipart/form-data">
      <input type="hidden" name="id" id="editServiceId">
      <input type="text" name="name" id="editServiceName" required>
      <input type="file" name="image">
      <button type="submit">Update</button>
    </form>
  </div>
</div>

<script>
// Add Service Popup
const addServicePopup = document.getElementById("addServicePopup");
const addServiceBtn = document.getElementById("addServiceBtn");
const addServiceCloseBtn = document.getElementById("addServiceCloseBtn");
addServiceBtn.addEventListener("click", () => { addServicePopup.style.display = "flex"; });
addServiceCloseBtn.addEventListener("click", () => { addServicePopup.style.display = "none"; });

// Edit Service Popup
const editServicePopup = document.getElementById("editServicePopup");
const editServiceCloseBtn = document.getElementById("editServiceCloseBtn");
editServiceCloseBtn.addEventListener("click", () => { editServicePopup.style.display = "none"; });

// Add Service Submit
document.getElementById("addServiceForm").addEventListener("submit", function(e){
  e.preventDefault();
  const formData = new FormData(this);
  fetch("{{ url_for('auth.manage_service') }}", { method: "POST", body: formData })
    .then(res => res.json())
    .then(data => {
      if(data.success){ location.reload(); }
      else { alert("Error: " + data.error); }
    });
});

// Delete Service
document.querySelectorAll(".deleteServiceBtn").forEach(btn => {
  btn.addEventListener("click", () => {
    const id = btn.dataset.id;
    fetch(`/admin/delete_service/${id}`, { method: "POST" })
      .then(res => res.json())
      .then(data => {
        if(data.success){ document.getElementById("row-"+id).remove(); }
        else { alert("Error: " + data.error); }
      });
  });
});

// Edit Service
document.querySelectorAll(".editServiceBtn").forEach(btn => {
  btn.addEventListener("click", () => {
    const id = btn.dataset.id;
    fetch(`/admin/get_service/${id}`)
      .then(res => res.json())
      .then(s => {
        document.getElementById("editServiceId").value = s.id;
        document.getElementById("editServiceName").value = s.name;
        editServicePopup.style.display = "flex";
      });
  });
});

// Edit Service Submit
document.getElementById("editServiceForm").addEventListener("submit", function(e){
  e.preventDefault();
  const formData = new FormData(this);
  fetch("/admin/edit_service", { method: "POST", body: formData })
    .then(res => res.json())
    .then(data => {
      if(data.success){ location.reload(); }
      else { alert("Error: " + data.error); }
    });
});
</script>

{% endblock %}
