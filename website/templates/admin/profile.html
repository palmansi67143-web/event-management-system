{% extends "admin/base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{url_for('static',filename='admin/css/profile.css')}}">

<div class="profile-container">

    <h2>My Profile</h2>

    <div class="profile-card">

        <div class="profile-image">
            <img src="{{ url_for('static', filename='admin/image/' ~ admin.image) }}" width="100">
        </div>

        <div class="profile-details">
            <p>Name: {{ admin.name }}</p>
            <p>Email: {{ admin.email }}</p>
            <p>Phone: {{ admin.phone }}</p>
        </div>

        <div class="profile-actions">
            <a href="{{ url_for('auth.edit_profile') }}" class="btn edit">Edit Profile</a>
            <a href="{{ url_for('auth.admin_logout') }}" class="btn logout">Logout</a>
        </div>

    </div>

</div>

{% endblock %}
