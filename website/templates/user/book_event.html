{% extends "user/base.html" %}
{% block title %}Book Now{% endblock %}
{% block content %}

<link rel="stylesheet" href="{{url_for('static',filename='user/css/booking.css')}}">

<div class="booking-form">

    <h2>Book Your Event</h2>

    <form method="POST">

        <input type="hidden" name="event_id" value="{{ event.id }}">
        <input type="hidden" name="venue_id" value="{{ venue.id if venue }}">

        <label>Event Name</label>
        <input type="text" value="{{ event.name }}" readonly>

        <label>Price</label>
        <input type="text" value="{{ event.price }}" readonly>

        <label>City</label>
        <input type="text" value="{{ event.city }}" readonly>

        <label>Venue</label>
        <input type="text" value="{{ venue.name if venue else '' }}" readonly>

        <label>Select Service</label>
        <select name="service_id">
            <option value="">Select Service</option>

            {% for s in services %}
            <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}

        </select>


        <label>Select Transport</label>
        <select name="transport_id">
            <option value="">Select Transport</option>

            {% for t in transports %}
            <option value="{{ t.id }}">{{ t.vehicle }}</option>
            {% endfor %}

        </select>
        <label>Your Name</label>
        <input type="text" name="user_name" required>

        <label>Your Email</label>
        <input type="email" name="user_email" required>

        <label>Phone</label>
        <input type="text" name="user_phone">

        <label>Event Date</label>
        <input type="date" name="event_date" min="{{ min_date }}" required>

        <button type="submit">Book Now</button>

    </form>

</div>

{% endblock %}
