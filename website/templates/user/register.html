{% extends "user/base.html" %}
{% block title %}Register{% endblock %}

{% block content %}

<style>
    body {
        background: #f5f5f5;
        font-family: Arial, sans-serif;
    }

    .register-wrapper {
        min-height: calc(100vh - 120px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    .register-container {
        width: 100%;
        max-width: 440px;
        background: white;
        padding: 35px 25px;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .register-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
        font-size: 26px;
        font-weight: 700;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
    }

    .form-group input:focus {
        border-color: #ff4d6d;
        outline: none;
    }

    .register-btn {
        width: 100%;
        padding: 12px;
        background: #ff4d6d;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 25px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 10px;
    }

    .register-btn:hover {
        background: #e63950;
    }

    .register-login-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        color: #555;
    }

    .register-login-link a {
        color: #ff4d6d;
        font-weight: 600;
    }

    @media (max-width: 480px) {
        .register-container {
            padding: 25px 18px;
        }

        .register-container h2 {
            font-size: 22px;
        }
    }
</style>

<div class="register-wrapper">
    <div class="register-container">
        <h2>User Register</h2>

        <form method="POST">
            <div class="form-group">
                <input type="text" name="name" placeholder="Enter Name" required>
            </div>

            <div class="form-group">
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="form-group">
                <input type="password" name="password" placeholder="Enter Password" pattern=".{6,}"
                    title="Password must be at least 6 characters" required>
            </div>

            <div class="form-group">
                <input type="text" name="phone" placeholder="Enter Phone Number" required>
            </div>

            <div class="form-group">
                <input type="text" name="address" placeholder="Enter Address" required>
            </div>

            <button type="submit" class="register-btn">Register</button>
        </form>

        <div class="register-login-link">
            Already have an account? <a href="/login">Login</a>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <p style="color:red;text-align:center;margin-top:15px;">{{ messages[0] }}</p>
        {% endif %}
        {% endwith %}
    </div>
</div>

{% endblock %}
